[package]
name = "sumafile-remote-test-server"
version = "1.0.0"
description = "Loopback SFTP test server and 1.0.4 metadata database writer for the SumaFile remote plugin's tests and smokes (never staged)"
authors = ["SumaFile Team"]
license = "MIT"
repository = "https://github.com/conniecombs/SumaFile"
edition = "2021"
publish = false

[lib]
name = "sumafile_remote_test_server"
path = "src/lib.rs"

[[bin]]
name = "sumafile-remote-test-server"
path = "src/main.rs"

[dependencies]
getrandom = "0.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring"] }
russh-sftp = "3.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
