name: Installer smoke

# Builds unsigned WinUI NSIS/MSI packages and runs the WinUI smoke scripts.
# Not on every PR: full packaging is expensive.
# Trigger manually or via the nightly schedule before a release.

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: installer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer-smoke:
    name: Windows NSIS and MSI smoke
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: installer-smoke-x86_64-pc-windows-msvc

      - name: Install WiX Toolset (MSI)
        shell: pwsh
        run: |
          function Resolve-WixBin {
            $command = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source | Split-Path -Parent }

            $candidates = @(
              'C:\Program Files (x86)\WiX Toolset v3.14\bin',
              'C:\Program Files (x86)\WiX Toolset v3.11\bin',
              'C:\Program Files\WiX Toolset v3.14\bin'
            )
            $candidate = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($candidate) { return $candidate }

            $found = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Filter 'candle.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { return $found.DirectoryName }

            return $null
          }

          $wixBin = Resolve-WixBin
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = Resolve-WixBin
          }
          if (-not $wixBin) {
            throw 'WiX bin directory not found after install.'
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX on PATH: $wixBin"
          & (Join-Path $wixBin 'candle.exe') -? | Select-Object -First 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      - name: Build WinUI dual-stack installers
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-winui-release.ps1 -SkipChecks -SkipSmoke -RequireInstaller

      - name: Smoke WinUI payload startup
        run: npm run smoke:winui

      - name: Smoke WinUI MSI extract and launch
        run: npm run smoke:winui-msi

      - name: Smoke WinUI NSIS install, launch, and uninstall
        run: npm run smoke:winui-installer

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sumafile-windows-installers
          path: |
            dist/winui/SumaFile_*_x64-winui-portable.zip
            dist/winui/SumaFile_*_x64-winui-setup.exe
            dist/winui/SumaFile_*_x64-winui.msi
            dist/winui/latest-winui.json
          if-no-files-found: warn
          retention-days: 14
