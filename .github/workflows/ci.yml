name: CI

on:
  push:
    branches: [main, 'C#']
  pull_request:
    branches: [main, 'C#']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality gate
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  repo-checks:
    name: Repo checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install repo tooling
        run: npm ci --ignore-scripts

      - name: Run repo checks
        run: npm run check

      - name: Test maintenance policies
        run: npm run test:maintenance

  security:
    name: Security checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: node scripts/cargo-audit-release.mjs


  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [quality, repo-checks, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Build backend
        run: cargo build -p simplefile-service --locked --release --target ${{ matrix.target }}

  winui:
    name: WinUI host
    runs-on: windows-2025
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: winui-service

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build Rust IPC service
        run: cargo build -p simplefile-service --locked --release

      - name: Run WinUI tests
        run: npm run check:winui

      - name: Build WinUI application and XAML
        run: npm run build:winui

      - name: Verify release artifact hashing
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-winui-release-hash.ps1

      - name: Smoke WinUI rendering, layout, and cancellation
        run: npm run smoke:winui-ui -- -Counts 10000

      - name: Upload WinUI runtime reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sumafile-winui-runtime
          path: test-results/ui-smoke/**/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check WinUI packaging surface
        run: node scripts/check-winui-packaging.mjs

  installer:
    name: Installer verification
    needs: [quality, repo-checks, security, build, winui]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref, 'connie/maintenance/')
    uses: ./.github/workflows/installer-smoke.yml

  required:
    name: CI required
    if: always()
    needs: [quality, repo-checks, security, build, winui, installer]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRE_INSTALLER: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref, 'connie/maintenance/') }}
        run: |
          node -e 'const r = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(r)) { if (name === "installer" && process.env.REQUIRE_INSTALLER === "false" && job.result === "skipped") continue; if (job.result !== "success") throw new Error(`${name}: ${job.result}`); }'
