name: Validated maintenance automerge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
concurrency:
  group: dependency-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  automerge:
    runs-on: ubuntu-22.04
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install trusted policy dependencies
        run: npm ci --ignore-scripts
      - name: Setup pinned formatter for repair verification
        uses: ./.github/actions/setup-rust
      - name: Verify the current PR and merge eligible dependencies
        run: node scripts/automerge-dependencies.mjs
        env:
          GH_TOKEN: ${{ github.token }}
