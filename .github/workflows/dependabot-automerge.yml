name: Dependabot auto-merge

# Run only after CI has completed. The previous pull_request trigger could
# enable auto-merge before any checks finished, allowing a broken dependency
# update to land on an unprotected branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Resolve and verify Dependabot pull request
        id: pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr_number="$WORKFLOW_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq 'map(select(.state == "open"))[0].number // empty')"
          fi

          if [[ -z "$pr_number" ]]; then
            echo "No open pull request is associated with CI commit $HEAD_SHA." >&2
            exit 1
          fi

          pr_author="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.user.login')"
          if [[ "$pr_author" != "dependabot[bot]" ]]; then
            echo "Refusing to auto-merge PR #$pr_number authored by $pr_author." >&2
            exit 1
          fi

          echo "url=https://github.com/$REPOSITORY/pull/$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
