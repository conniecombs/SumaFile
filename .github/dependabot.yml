version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"

  # NPM dependencies in root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"

  # All WinUI projects, including application and test dependencies.
  - package-ecosystem: "nuget"
    directory: "/src-winui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # docs/PLUGINS.md pins these three for plugin authors, and a test holds the table to the lock file. A bump is
      # a plugin-compatibility decision made by a person, with the table edited; left to Dependabot it opened one
      # red pull request per package per project directory.
      - dependency-name: "CommunityToolkit.Mvvm"
      - dependency-name: "Microsoft.Windows.SDK.BuildTools"
      - dependency-name: "Microsoft.WindowsAppSDK"
      # These follow the .NET runtime's version: their next major is for the next .NET, not for this app's.
      # Remove both rules when the app moves to that .NET.
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "dotnet"]


