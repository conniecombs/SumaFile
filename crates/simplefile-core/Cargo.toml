[package]
name = "simplefile-core"
version = "1.2.0"
description = "Reusable SumaFile backend domain types and utilities"
authors = ["SumaFile Team"]
license = "MIT"
repository = "https://github.com/conniecombs/SumaFile"
edition = "2021"

[dependencies]
chrono = "0.4"
log = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
trash = "5"
getrandom = "0.4"
filetime = "0.2"
base64 = "0.23"
ed25519-dalek = "3"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Thumbnails: SIMD scaling, and JPEG decoding at reduced size (no worker threads).
fast_image_resize = "6.1"
jpeg-decoder = { version = "0.3.2", default-features = false }
# Lazy columns: video duration from MP4/MOV (mp4) and MKV/WebM (matroska) containers.
mp4 = "0.14"
matroska = "0.30"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sumafile-transfer = { path = "../sumafile-transfer" }
serde_json = "1"
tar = "0.4"
unrar = "0.5"
exif = { package = "kamadak-exif", version = "0.6" }
lopdf = { version = "0.47", default-features = false }
lofty = "0.25"
zip = { version = "9", default-features = false, features = ["bzip2", "deflate64", "deflate", "lzma", "ppmd", "time", "zstd", "xz"] }
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WNet",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
] }
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
