[package]
name = "simplefile-service"
version = "1.1.0"
description = "SumaFile named-pipe JSON-RPC IPC service"
authors = ["SumaFile Team"]
license-file = "../../LICENSE"
repository = "https://github.com/conniecombs/SimpleFile-Windows"
edition = "2021"

[lib]
name = "simplefile_service"
path = "src/lib.rs"

[[bin]]
name = "simplefile-service"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
glob = "0.3"
notify = { version = "8", features = ["serde"] }
opener = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplefile-core = { path = "../simplefile-core" }
simplefile-ipc = { path = "../simplefile-ipc" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
