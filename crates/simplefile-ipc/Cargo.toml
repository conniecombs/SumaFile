[package]
name = "simplefile-ipc"
version = "1.0.4"
description = "SumaFile IPC protocol constants and schema tests"
authors = ["SumaFile Team"]
license = "MIT"
repository = "https://github.com/conniecombs/SumaFile"
edition = "2021"
rust-version = "1.98.0"
readme = "README.md"
keywords = ["sumafile", "ipc", "json-rpc", "named-pipe", "protocol"]
categories = ["encoding", "network-programming"]
# The schema test reads ../../ipc/schema/v1, which is not in the package; it runs in the workspace only.
exclude = ["tests/schema_consistency.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
